name: Testowanie  kodu
 
on:
    push:
        branches: [main]
        paths-ignore:
            - '**/*.md'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**/*.md'

jobs:
    testy:
        #runs-on -srodowisko w ktorym bedzie wykonywany job(test)
        runs-on: ubuntu-24.04

        #steps - lista krokow jakie maja byc wykonane w ramach joba
        steps:
            -
                name: Pobieranie kodu
                uses: actions/checkout@v4
                    #uses - okresla akcje ktora ma byc wykonana w ramach kroku

            -
                name: Instalacja Pythona
                uses: actions/setup-python@v5
                with:
                    python-version: 3.12   

            -
                name: Instalacja zależności
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt

            -
                name: Uruchamianie testów
                run: python -m pytest -v